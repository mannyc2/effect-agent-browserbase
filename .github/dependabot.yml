version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
  # Effect and Playwright in one weekly PR, which CI checks; nothing merges automatically. Other
  # dependencies are updated by hand.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    versioning-strategy: increase
    allow:
      - dependency-name: effect
      - dependency-name: '@effect/*'
      - dependency-name: playwright-core
    ignore:
      # @effect/tsgo is pinned to the oxlint and oxlint-tsgolint versions it supports.
      - dependency-name: '@effect/tsgo'
    groups:
      runtime:
        patterns: ['effect', '@effect/*', 'playwright-core']
