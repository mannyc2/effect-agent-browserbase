version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
  # Effect Agent and the Effect release it peers on move together, in one weekly PR that full
  # acceptance checks; nothing merges automatically. Versions are written in each manifest rather
  # than a Bun catalog, which Dependabot does not maintain. If a PR updates a development version
  # but not agent-browser's exact @yielded/agent peer, the tooling stage refuses it until the peer
  # is updated too. Other dependencies stay coordinated by hand.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    versioning-strategy: increase
    allow:
      - dependency-name: effect
      - dependency-name: "@effect/*"
      - dependency-name: "@yielded/agent"
      - dependency-name: "@yielded/agent-testing"
    ignore:
      # @effect/tsgo is pinned to the oxlint and oxlint-tsgolint versions it supports.
      - dependency-name: "@effect/tsgo"
    groups:
      effect:
        patterns: ["effect", "@effect/*", "@yielded/agent", "@yielded/agent-testing"]
