name: Browserbase canonical development inputs

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/browserbase-development-inputs.yml'

permissions:
  contents: read

jobs:
  prepare:
    if: ${{ github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: 'true'
      VP_GIT_HOOKS: '0'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Fetch exact sources and full public packages
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/browserbase-development"
          mkdir -p "$OUT/bin" "$OUT/consumer" "$OUT/source"
          cp "$(command -v node)" "$OUT/bin/node"
          cp "$(command -v bun)" "$OUT/bin/bun"
          git clone --quiet https://github.com/danieljvdm/effect-agent "$RUNNER_TEMP/canonical-effect-agent"
          git -C "$RUNNER_TEMP/canonical-effect-agent" cat-file -e ea53ea6671a94eb44b8019e942cc2c9468786723^{commit}
          git -C "$RUNNER_TEMP/canonical-effect-agent" archive ea53ea6671a94eb44b8019e942cc2c9468786723 | tar -x -C "$OUT/source"
          git -C "$RUNNER_TEMP/canonical-effect-agent" show -s --format=fuller ea53ea6671a94eb44b8019e942cc2c9468786723 > "$OUT/UPSTREAM.txt"
          git -C "$RUNNER_TEMP/canonical-effect-agent" ls-tree -r ea53ea6671a94eb44b8019e942cc2c9468786723 > "$OUT/UPSTREAM-TREE.txt"
          git archive HEAD | tar -x -C "$OUT" --one-top-level=candidate
          cat > "$OUT/consumer/package.json" <<'JSON'
          {"name":"browserbase-development-inputs","private":true,"type":"module","dependencies":{"effect":"4.0.0-rc.115","effect-agent":"0.1.0-beta.102","@effect-agent/testing":"0.1.0-beta.102","@effect/platform-node":"4.0.0-rc.115","@effect/platform-bun":"4.0.0-rc.115","@effect/vitest":"4.0.0-rc.115","playwright-core":"1.63.0","typescript":"7.0.2","typescript-twoslash":"npm:typescript@6.0.3","@types/node":"26.1.2","@effect/tsgo":"0.45.0","esbuild":"0.28.1","vite-plus":"0.3.2","vite":"npm:@voidzero-dev/vite-plus-core@0.3.2","vitest":"4.1.11"},"overrides":{"effect":"4.0.0-rc.115","@effect/platform-node":"4.0.0-rc.115","@effect/platform-node-shared":"4.0.0-rc.115","@effect/platform-bun":"4.0.0-rc.115","@effect/vitest":"4.0.0-rc.115","vitest":"4.1.11"}}
          JSON
          (cd "$OUT/consumer" && bun install --ignore-scripts && bun install --ignore-scripts --frozen-lockfile)
          (cd "$OUT/consumer" && node --input-type=module -e 'import { AgentRuntime } from "effect-agent"; import { ScriptedModel } from "@effect-agent/testing/scripted-model"; import { chromium } from "playwright-core"; if (typeof AgentRuntime.run !== "function" || typeof ScriptedModel.layer !== "function" || typeof chromium.connectOverCDP !== "function") process.exit(1); console.log("real public imports passed")')
          printf 'node=%s\nbun=%s\ncandidate=%s\n' "$(node --version)" "$(bun --version)" "$(git rev-parse HEAD)" > "$OUT/RUNTIMES.txt"
          # Preserve all source/code and dependency metadata. Only visual font
          # assets for unrelated web UIs are omitted from this transfer artifact.
          find "$OUT" -type f \( -iname '*.woff' -o -iname '*.woff2' -o -iname '*.ttf' -o -iname '*.otf' \) -printf '%P\n' > "$OUT/OMITTED-VISUAL-ASSETS.txt"
          tar --exclude='*.woff' --exclude='*.woff2' --exclude='*.ttf' --exclude='*.otf' -czf "$RUNNER_TEMP/browserbase-development-inputs.tar.gz" -C "$RUNNER_TEMP" browserbase-development
          sha256sum "$RUNNER_TEMP/browserbase-development-inputs.tar.gz" > "$RUNNER_TEMP/browserbase-development-inputs.sha256"
          cat "$RUNNER_TEMP/browserbase-development-inputs.sha256"
          mkdir "$RUNNER_TEMP/readback"
          tar -xzf "$RUNNER_TEMP/browserbase-development-inputs.tar.gz" -C "$RUNNER_TEMP/readback"
          cd "$RUNNER_TEMP/readback/browserbase-development/consumer"
          ../bin/node --input-type=module -e 'import { AgentRuntime } from "effect-agent"; import { ScriptedModel } from "@effect-agent/testing/scripted-model"; if (typeof AgentRuntime.run !== "function" || typeof ScriptedModel.layer !== "function") process.exit(1); console.log("fresh-extraction public imports passed")'
      - uses: actions/upload-artifact@v4
        with:
          name: browserbase-development-inputs
          path: |
            ${{ runner.temp }}/browserbase-development-inputs.tar.gz
            ${{ runner.temp }}/browserbase-development-inputs.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
