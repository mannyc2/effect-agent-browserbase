name: Browserbase canonical development inputs

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/browserbase-inputs.yml']

permissions:
  contents: read

jobs:
  inputs:
    if: ${{ github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      VP_GIT_HOOKS: '0'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Export canonical source and focused tooling
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.14.1
          test "$(bun --version)" = 1.4.2
          OUT="$RUNNER_TEMP/browserbase-inputs"
          mkdir -p "$OUT" "$RUNNER_TEMP/tooling/bin"
          git clone --quiet https://github.com/danieljvdm/effect-agent.git "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" cat-file -e ea53ea6671a94eb44b8019e942cc2c9468786723^{commit}
          git -C "$RUNNER_TEMP/upstream" archive --format=tar.gz --prefix=upstream/ ea53ea6671a94eb44b8019e942cc2c9468786723 > "$OUT/upstream.tar.gz"
          git archive --format=tar.gz --prefix=candidate/ HEAD > "$OUT/candidate.tar.gz"
          git -C "$RUNNER_TEMP/upstream" show ea53ea6671a94eb44b8019e942cc2c9468786723:AGENTS.md > "$OUT/upstream-AGENTS.md"
          cd "$RUNNER_TEMP/tooling"
          cat > package.json <<'JSON'
          {
            "name": "browserbase-canonical-tooling",
            "private": true,
            "type": "module",
            "dependencies": {
              "effect": "4.0.0-rc.115",
              "effect-agent": "0.1.0-beta.102",
              "@effect-agent/testing": "0.1.0-beta.102",
              "playwright-core": "1.63.0",
              "@effect/platform-node": "4.0.0-rc.115",
              "@effect/platform-bun": "4.0.0-rc.115",
              "@effect/platform-node-shared": "4.0.0-rc.115",
              "@effect/vitest": "4.0.0-rc.115",
              "@effect/tsgo": "0.45.0",
              "@types/node": "26.1.2",
              "typescript": "7.0.2",
              "typescript-twoslash": "npm:typescript@6.0.3",
              "vite-plus": "0.3.2",
              "vite": "npm:@voidzero-dev/vite-plus-core@0.3.2",
              "vitest": "4.1.11",
              "esbuild": "0.28.1"
            },
            "overrides": {
              "effect": "4.0.0-rc.115",
              "@effect/platform-node-shared": "4.0.0-rc.115",
              "@effect/vitest": "4.0.0-rc.115",
              "vitest": "4.1.11"
            }
          }
          JSON
          bun install --ignore-scripts
          bun install --frozen-lockfile --ignore-scripts
          cp "$(command -v node)" bin/node
          cp "$(command -v bun)" bin/bun
          node --input-type=module -e 'import { AgentRuntime } from "effect-agent"; import { ScriptedModel } from "@effect-agent/testing/scripted-model"; import { chromium } from "playwright-core"; console.log(typeof AgentRuntime.run, typeof ScriptedModel.layer, typeof chromium.connectOverCDP)'
          bun -e 'import { AgentRuntime } from "effect-agent"; import { ScriptedModel } from "@effect-agent/testing/scripted-model"; console.log(typeof AgentRuntime.run, typeof ScriptedModel.layer)'
          printf 'Node %s\nBun %s\nUpstream ea53ea6671a94eb44b8019e942cc2c9468786723\nCandidate %s\n' "$(node --version)" "$(bun --version)" "$GITHUB_SHA" > VERSIONS.txt
          # This capsule is deliberately not claimed to be the full monorepo install.
          # Preserve all dependency licenses; exclude font binaries from the transport.
          tar --exclude='*.woff' --exclude='*.woff2' --exclude='*.ttf' --exclude='*.otf' -czf "$OUT/tooling.tar.gz" -C "$RUNNER_TEMP" tooling
          cd "$OUT"
          sha256sum *.tar.gz > SHA256SUMS
          ls -lh
          cat SHA256SUMS
      - name: Preserve source archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browserbase-canonical-sources
          path: |
            ${{ runner.temp }}/browserbase-inputs/upstream.tar.gz
            ${{ runner.temp }}/browserbase-inputs/candidate.tar.gz
            ${{ runner.temp }}/browserbase-inputs/SHA256SUMS
          retention-days: 7
          compression-level: 0
      - name: Preserve focused runtime and toolchain inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browserbase-canonical-tooling
          path: |
            ${{ runner.temp }}/browserbase-inputs/tooling.tar.gz
            ${{ runner.temp }}/browserbase-inputs/SHA256SUMS
          retention-days: 7
          compression-level: 0
