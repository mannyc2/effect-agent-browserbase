name: Browserbase local Chromium input

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/browserbase-native-inputs.yml']
permissions:
  contents: read
jobs:
  chromium:
    if: ${{ github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Obtain the exact Playwright browser, without starting a session
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/browserbase-chromium
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir browserbase-browser-input
          cd browserbase-browser-input
          printf '{"name":"local-chromium-input","private":true,"dependencies":{"playwright-core":"1.63.0"}}\n' > package.json
          bun install --ignore-scripts
          node node_modules/playwright-core/cli.js install chromium --only-shell
          tar --exclude='*.ttf' --exclude='*.otf' --exclude='*.woff' --exclude='*.woff2' -czf "$RUNNER_TEMP/browserbase-chromium.tar.gz" -C "$RUNNER_TEMP" browserbase-chromium
          sha256sum "$RUNNER_TEMP/browserbase-chromium.tar.gz" > "$RUNNER_TEMP/browserbase-chromium.sha256"
          cat "$RUNNER_TEMP/browserbase-chromium.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: browserbase-local-chromium
          path: |
            ${{ runner.temp }}/browserbase-chromium.tar.gz
            ${{ runner.temp }}/browserbase-chromium.sha256
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
