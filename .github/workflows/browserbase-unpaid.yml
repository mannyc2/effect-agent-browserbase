name: Browserbase unpaid baseline

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/platform-browserbase/**'
      - 'tools/**'
      - '.github/workflows/browserbase-unpaid.yml'

permissions:
  contents: read

concurrency:
  group: browserbase-unpaid-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  baseline:
    # Only standard public-repository runners; no hosted browser or model credentials.
    if: ${{ github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      VP_GIT_HOOKS: '0'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install supported Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Record runtime and verify preserved checkpoint
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v24.14.1'
          test "$(bun --version)" = '1.4.2'
          git rev-parse HEAD
          node --version
          bun --version
          python3 tools/verify-checkpoint.py checkpoints/browserbase-continuation-04.zip

      - name: Restore canonical upstream and dependencies
        id: bootstrap
        continue-on-error: true
        run: |
          set -euo pipefail
          timeout 600s bash tools/bootstrap.sh "$RUNNER_TEMP/browserbase-upstream"
          test "$(git -C "$RUNNER_TEMP/browserbase-upstream/tree" rev-parse HEAD)" = ea53ea6671a94eb44b8019e942cc2c9468786723
          # The bootstrap applies the preserved patch once. Refuse stale-baseline tests
          # if current package source later diverges; do not quietly test old code.
          diff -r -x node_modules "$RUNNER_TEMP/browserbase-upstream/tree/packages/platform-browserbase" packages/platform-browserbase

      - name: Independent boundary harness on Node and Bun
        id: boundary
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          timeout 300s bash tools/run-boundary-suite.sh "$RUNNER_TEMP/browserbase-boundary"

      - name: Verify real public-package imports on both runtimes
        id: imports
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/browserbase-public-consumer"
          cd "$RUNNER_TEMP/browserbase-public-consumer"
          cat > package.json <<'JSON'
          {"name":"browserbase-public-import-check","private":true,"type":"module","dependencies":{"effect":"4.0.0-rc.115","effect-agent":"0.1.0-beta.102","@effect-agent/testing":"0.1.0-beta.102","playwright-core":"1.63.0"}}
          JSON
          timeout 180s bun install --ignore-scripts
          cat > check.mjs <<'JS'
          import assert from 'node:assert/strict';
          import { createRequire } from 'node:module';
          import { Effect } from 'effect';
          import { Agent, AgentRuntime, InMemory } from 'effect-agent';
          import { ScriptedModel } from '@effect-agent/testing/scripted-model';
          import { Tool, Toolkit } from 'effect/unstable/ai';
          import { chromium } from 'playwright-core';
          const require = createRequire(import.meta.url);
          assert.equal(typeof Effect.gen, 'function');
          assert.equal(typeof Agent.make, 'function');
          assert.equal(typeof AgentRuntime.run, 'function');
          assert.ok(InMemory.layer);
          assert.equal(typeof ScriptedModel.layer, 'function');
          assert.equal(typeof Tool.make, 'function');
          assert.equal(typeof Toolkit.make, 'function');
          assert.equal(typeof chromium.connectOverCDP, 'function');
          assert.equal(require('playwright-core/package.json').version, '1.63.0');
          console.log(JSON.stringify({node:process.version,bun:process.versions.bun ?? null,playwright:require('playwright-core/package.json').version,result:'public imports passed',limit:'No interpreter run, browser launch, or Browserbase session.'}));
          JS
          node check.mjs
          bun check.mjs

      - name: Package typecheck through Vite+
        id: typecheck
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        continue-on-error: true
        working-directory: ${{ runner.temp }}/browserbase-upstream/tree
        run: timeout 180s ./node_modules/.bin/vp run -F @effect-agent/platform-browserbase check

      - name: Unmodified package tests through Vite+
        id: tests
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        continue-on-error: true
        working-directory: ${{ runner.temp }}/browserbase-upstream/tree/packages/platform-browserbase
        run: timeout 240s ../../node_modules/.bin/vp test --run

      - name: Package build through Vite+
        id: build
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        continue-on-error: true
        working-directory: ${{ runner.temp }}/browserbase-upstream/tree
        run: timeout 180s ./node_modules/.bin/vp run -F @effect-agent/platform-browserbase build

      - name: Enforce actual results
        if: ${{ !cancelled() }}
        env:
          BOOTSTRAP: ${{ steps.bootstrap.outcome }}
          BOUNDARY: ${{ steps.boundary.outcome }}
          IMPORTS: ${{ steps.imports.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          printf 'bootstrap=%s boundary=%s imports=%s typecheck=%s tests=%s build=%s\n' "$BOOTSTRAP" "$BOUNDARY" "$IMPORTS" "$TYPECHECK" "$TESTS" "$BUILD"
          printf '## Unpaid baseline\n\nBootstrap: %s\n\nBoundary: %s\n\nPublic imports: %s\n\nTypecheck: %s\n\nTests: %s\n\nBuild: %s\n\nThis is not full AgentRuntime, native-browser, packed-consumer, or hosted acceptance.\n' "$BOOTSTRAP" "$BOUNDARY" "$IMPORTS" "$TYPECHECK" "$TESTS" "$BUILD" >> "$GITHUB_STEP_SUMMARY"
          test "$BOOTSTRAP" = success && test "$BOUNDARY" = success && test "$IMPORTS" = success && test "$TYPECHECK" = success && test "$TESTS" = success && test "$BUILD" = success
