name: Library CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable source commit supplied by the release workflow
        required: false
        default: ''
        type: string
    outputs:
      artifact_id:
        description: Immutable acceptance artifact from this run
        value: ${{ jobs.acceptance.outputs.artifact_id }}
      release_set_sha256:
        description: Hash of the source-bound two-package release-set receipt
        value: ${{ jobs.acceptance.outputs.release_set_sha256 }}

permissions:
  contents: read

concurrency:
  group: library-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  acceptance:
    name: Unpaid acceptance
    # Fork PRs are welcome. No credentials, hosted sessions or write permissions.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      release_set_sha256: ${{ steps.release.outputs.sha256 }}
    env:
      CI: 'true'
      VP_GIT_HOOKS: '0'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Set isolated acceptance workspace
        run: printf 'BROWSERBASE_WORK_ROOT=%s/browserbase-maintenance\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
          no-cache: true
      - name: Execute complete unpaid acceptance
        run: bash tools/run-acceptance.sh
      - name: Record tested release-set digest
        id: release
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { releaseSetDigest } from './tools/package-release.mjs';
          import { verifyReleaseSet } from './tools/verify-release.mjs';
          const directory = `${process.env.BROWSERBASE_WORK_ROOT}/results`;
          const receipt = JSON.parse(readFileSync(`${directory}/release-set.json`, 'utf8'));
          const source = readFileSync(`${directory}/source-sha.txt`, 'utf8').trim();
          const digest = releaseSetDigest(directory);
          verifyReleaseSet(directory, source, `v${receipt.version}`, digest);
          appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${digest}\n`);
          JS
      - name: Retain source, package, logs, video and checksums
        id: artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browserbase-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browserbase-maintenance/results
          if-no-files-found: error
          retention-days: 14
