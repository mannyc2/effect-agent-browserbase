name: Library CI

on:
  # Stacked implementation PRs need the same feedback as PRs targeting main.
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: Full upstream integration or focused library acceptance
        type: choice
        options: [full, library]
        default: full
  workflow_call:
    inputs:
      source_sha:
        description: Immutable source commit supplied by the release workflow
        required: false
        default: ''
        type: string
      full_acceptance:
        description: Reusable release validation defaults to the full gate
        required: false
        default: true
        type: boolean
    outputs:
      artifact_id:
        description: Full-acceptance artifact only; focused results cannot authorize release
        value: ${{ jobs.acceptance.outputs.artifact_id }}
      release_set_sha256:
        description: Hash of the source-bound three-package release-set receipt
        value: ${{ jobs.acceptance.outputs.release_set_sha256 }}
      release_tooling_artifact_id:
        description: Immutable tested ts-release host and frozen dependencies
        value: ${{ jobs.release-tooling.outputs.artifact_id }}
      release_tooling_sha256:
        description: SHA-256 of the tested release-tooling archive
        value: ${{ jobs.release-tooling.outputs.sha256 }}

permissions:
  contents: read

concurrency:
  group: library-ci-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.source_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  release-tooling:
    name: Native release recovery
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
          no-cache: true
      - name: Install frozen release tooling without lifecycle scripts
        working-directory: tools/release
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test native provider and durable recovery without public writes
        working-directory: tools/release
        run: |
          bun run check
          bun test
          bun run build
      - name: Package and smoke-test the relocated host with production Node
        id: pack
        run: |
          digest="$(bun tools/release/scripts/pack.mjs "$RUNNER_TEMP/release-tooling")"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: artifact
        with:
          name: browserbase-release-tooling-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-tooling
          if-no-files-found: error
          retention-days: 14

  acceptance:
    # Always report the same required check, including explicitly docs-only work.
    name: Unpaid acceptance
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.release.outcome == 'success' && steps.artifact.outputs.artifact-id || '' }}
      release_set_sha256: ${{ steps.release.outputs.sha256 }}
    env:
      CI: 'true'
      VP_GIT_HOOKS: '0'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Set isolated acceptance workspace
        run: printf 'BROWSERBASE_WORK_ROOT=%s/browserbase-maintenance\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PRs validate the immutable merged candidate so older heads inherit CI tools.
          # Release callers still pin their exact source; evidence records the checked-out SHA.
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
          no-cache: true
      - name: Select and record the required validation scope
        id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CI_FORCE_FULL: ${{ inputs.full_acceptance == true || inputs.source_sha != '' }}
          CI_REQUESTED_PROFILE: ${{ inputs.profile || 'full' }}
        run: node tools/ci-plan.mjs write "$BROWSERBASE_WORK_ROOT/ci-plan.json"
      # Only the scheduled all-suite canary runs upstream's PostgreSQL certification.
      # Reachable full acceptance and focused profiles need no database.
      - name: Start upstream PostgreSQL fixture
        if: ${{ github.event_name == 'schedule' && steps.plan.outputs.profile == 'full' }}
        run: |
          docker run --detach --name effect-agent-test-postgres \
            --publish 127.0.0.1:55432:5432 \
            --env POSTGRES_PASSWORD=postgres --env POSTGRES_DB=effect_agent \
            --health-cmd 'pg_isready -U postgres -d effect_agent' \
            --health-interval 1s --health-timeout 5s --health-retries 30 \
            postgres:17-alpine
          timeout 60s bash -c 'until [ "$(docker inspect --format "{{.State.Health.Status}}" effect-agent-test-postgres)" = healthy ]; do sleep 1; done'
      # The workspace identity, not the candidate, decides whether a stored upstream task
      # result can apply at all: the pinned upstream revision lives in bootstrap.sh, the
      # integration diff in upstream.patch, the runtime in .node-version. Vite Task still
      # re-checks every task's own inputs, so this key only narrows what is worth downloading.
      - name: Restore upstream task cache
        id: task-cache
        if: ${{ steps.plan.outputs.profile == 'full' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/browserbase-task-cache
          key: >-
            browserbase-task-${{ runner.os }}-${{ hashFiles('tools/bootstrap.sh', 'upstream.patch',
            '.node-version') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            browserbase-task-${{ runner.os }}-${{ hashFiles('tools/bootstrap.sh', 'upstream.patch', '.node-version') }}-
      # The nightly run is the drift canary: a replayed task would report yesterday's pass for
      # today's runner image. It runs cold and still exports, so it also refreshes the cache.
      - name: Keep the scheduled gate cold
        if: ${{ github.event_name == 'schedule' }}
        run: rm -rf "$RUNNER_TEMP/browserbase-task-cache"
      - name: Execute recorded acceptance profile
        env:
          ACCEPTANCE_PROFILE: ${{ steps.plan.outputs.profile }}
          BROWSERBASE_TASK_CACHE: ${{ steps.plan.outputs.profile == 'full' && format('{0}/browserbase-task-cache', runner.temp) || '' }}
          # The nightly canary runs every upstream suite; candidates run the ones the patch reaches.
          BROWSERBASE_UPSTREAM_TESTS: ${{ github.event_name == 'schedule' && 'all' || 'reachable' }}
        # This is a watchdog, not a performance claim. A cold library run exceeded eight
        # minutes while all stages passed; leave room for installation and runner variance.
        timeout-minutes: ${{ steps.plan.outputs.profile == 'full' && 55 || 12 }}
        run: bash tools/run-acceptance.sh "$ACCEPTANCE_PROFILE"
      # A run that never reached the upstream stages exports nothing; saving the empty directory
      # would store a newer entry that shadows a usable older one under the same prefix.
      - name: Report exported task cache
        id: exported
        if: ${{ !cancelled() && steps.plan.outputs.profile == 'full' }}
        run: |
          entry="$(find "$RUNNER_TEMP/browserbase-task-cache" -type f -print -quit 2>/dev/null || true)"
          printf 'present=%s\n' "$([ -n "$entry" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Save upstream task cache
        if: ${{ !cancelled() && steps.exported.outputs.present == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/browserbase-task-cache
          key: ${{ steps.task-cache.outputs.cache-primary-key }}
      - name: Record fully tested release-set digest
        id: release
        if: ${{ success() && steps.plan.outputs.profile == 'full' }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { verifyStages } from './tools/ci-evidence.mjs';
          import { releaseSetDigest } from './tools/package-release.mjs';
          import { verifyReleaseSet } from './tools/verify-release.mjs';
          const directory = `${process.env.BROWSERBASE_WORK_ROOT}/results`;
          verifyStages(directory, 'full');
          const receipt = JSON.parse(readFileSync(`${directory}/release-set.json`, 'utf8'));
          const source = readFileSync(`${directory}/source-sha.txt`, 'utf8').trim();
          const digest = releaseSetDigest(directory);
          verifyReleaseSet(directory, source, `v${receipt.version}`, digest);
          appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${digest}\n`);
          JS
      - name: Retain source, packages, logs, video and checksums
        id: artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browserbase-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browserbase-maintenance/results
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
          # Generated evidence only, no checkout/home/credentials. Preserve all files
          # named by SHA256SUMS, including diagnostic dependencies on failed runs.
          include-hidden-files: true
      - name: Stop upstream PostgreSQL fixture
        if: ${{ always() && github.event_name == 'schedule' && steps.plan.outputs.profile == 'full' }}
        run: |
          if docker container inspect effect-agent-test-postgres >/dev/null 2>&1; then
            docker rm --force effect-agent-test-postgres
          fi
