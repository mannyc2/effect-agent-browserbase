# Publishes effect-browser, effect-browserbase and effect-browser-human-strokes to npm with
# provenance, through npm trusted publishing. Dispatch it on a v<version> tag that is on main;
# docs/RELEASING.md has the steps. A dry run, the default, never reaches the npm environment.
name: Publish

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build, check and pack, and run npm publish --dry-run, but publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      dist-tag: ${{ steps.tag.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag and manifests
        id: tag
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag || { echo "Dispatch this on a version tag, not a branch." >&2; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main." >&2; exit 1; }
          for dir in packages/browser packages/browserbase packages/human-strokes; do
            version="$(jq -r .version "$dir/package.json")"
            test "$GITHUB_REF_NAME" = "v$version" || { echo "$dir is at $version, not $GITHUB_REF_NAME." >&2; exit 1; }
            # npm refuses provenance for a package whose repository is not the one publishing it.
            repository="$(jq -r .repository.url "$dir/package.json")"
            test "$repository" = "git+https://github.com/$GITHUB_REPOSITORY.git" || { echo "$dir names $repository as its repository." >&2; exit 1; }
          done
          # A prerelease goes to its own dist-tag, never to latest.
          if [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]; then dist_tag="${BASH_REMATCH[1]}"
          elif [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then dist_tag=latest
          else echo "$version is neither x.y.z nor x.y.z-(alpha|beta|rc).N." >&2; exit 1
          fi
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run patch:tsgo
      - run: ./node_modules/.bin/playwright-core install --with-deps chromium
      - run: bun run ready
      - name: Pack
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/packages"
          for dir in packages/browser packages/browserbase packages/human-strokes; do
            # bun writes the version each workspace:* range resolves to.
            (cd "$dir" && bun pm pack --destination "$RUNNER_TEMP/packages" --quiet)
          done
      - name: npm publish --dry-run
        env:
          DIST_TAG: ${{ steps.tag.outputs.dist-tag }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for name in effect-browser effect-browserbase effect-browser-human-strokes; do
            # npm 11 refuses even a dry run over a published version, so a re-dispatch skips it,
            # as the publish job does.
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "$name@$version is already on npm."
              continue
            fi
            npm publish "$RUNNER_TEMP/packages/$name-$version.tgz" --dry-run --tag "$DIST_TAG"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: ${{ runner.temp }}/packages
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      # The OIDC token npm exchanges for a publish credential and signs provenance with.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: ${{ runner.temp }}/packages
      # The archives the build job checked, in dependency order. A version already on npm is
      # skipped, so dispatching the same tag again finishes an interrupted release.
      - name: npm publish
        env:
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for name in effect-browser effect-browserbase effect-browser-human-strokes; do
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "$name@$version is already on npm."
              continue
            fi
            npm publish "$RUNNER_TEMP/packages/$name-$version.tgz" --provenance --tag "$DIST_TAG"
          done
