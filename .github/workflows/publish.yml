name: npm release

# Manual only. Select an existing v<package-version> tag that is already on main.
# Selecting a tag also makes npm provenance identify the actual released commit.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified two-package set (false performs acceptance and dry-run only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  resolve:
    name: Validate release identity
    if: ${{ github.repository == 'mannyc2/effect-agent-browserbase' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify tag, version, ancestry and explicit opt-in
        id: identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          test "$REF_TYPE" = tag || { echo 'Dispatch this workflow on a version tag, not a branch.' >&2; exit 1; }
          if [ "$PUBLISH_REQUESTED" = true ] && [ "$PUBLISH_ENABLED" != true ]; then
            echo 'Publishing is disabled. Configure npm OIDC and set NPM_PUBLISH_ENABLED=true first.' >&2
            exit 1
          fi
          node --input-type=module <<'JS'
          import { checkTag, readPackageSet } from './tools/packages.mjs';
          for (const manifest of readPackageSet(process.cwd())) checkTag(process.env.RELEASE_TAG, manifest.version);
          JS
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Verify exact release candidate
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
    permissions:
      contents: read

  publish:
    name: Publish verified release set through npm OIDC
    needs: [resolve, build]
    if: ${{ inputs.publish && vars.NPM_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Download this run's immutable tested artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/npm-release
          merge-multiple: true
      - name: Verify and publish without install, build, tokens or lifecycle scripts
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_DIGEST: ${{ needs.build.outputs.release_set_sha256 }}
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/npm-release
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-release.npmrc
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
          NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.14.1
          test "$(npm --version)" = 11.11.0
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
          # The dependency-free publisher verifies both immutable artifacts before
          # publishing generic first; an intentional retry accepts only identical bytes.
          # No installs, builds or package lifecycle scripts (--ignore-scripts).
          node tools/publish-release.mjs "$ARTIFACT_DIRECTORY" "$SOURCE_SHA" "$RELEASE_TAG" "$EXPECTED_DIGEST" --publish
