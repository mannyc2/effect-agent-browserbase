name: npm release

# Manual only. Select an existing v<package-version> tag that is already on main.
# Selecting a tag also makes npm provenance identify the actual released commit.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified three-package set (false performs acceptance and dry-run only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  resolve:
    name: Validate release identity
    if: ${{ github.repository == 'mannyc2/effect-agent-browserbase' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify tag, version, ancestry and explicit opt-in
        id: identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          test "$REF_TYPE" = tag || { echo 'Dispatch this workflow on a version tag, not a branch.' >&2; exit 1; }
          if [ "$PUBLISH_REQUESTED" = true ] && [ "$PUBLISH_ENABLED" != true ]; then
            echo 'Publishing is disabled. Configure npm OIDC and set NPM_PUBLISH_ENABLED=true first.' >&2
            exit 1
          fi
          node --input-type=module <<'JS'
          import { checkTag, readPackageSet } from './tools/packages.mjs';
          for (const manifest of readPackageSet(process.cwd())) checkTag(process.env.RELEASE_TAG, manifest.version);
          JS
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # A tag points at a main commit that may already have passed full acceptance (a merge that
  # changed the integration, the nightly run, or a manual dispatch). Publishing those exact tested archives avoids repeating a ~30 minute gate;
  # the same digests are re-derived here before anything is trusted.
  #
  # Reuse is only ever a shortcut. Every step below may fail without failing the release: an
  # API error, an expired artifact or evidence that does not verify all leave `reused` false,
  # and the full gate then runs for the tag exactly as it would have without this job.
  reuse:
    name: Reuse full acceptance for this exact commit
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      reused: ${{ steps.verify.outcome == 'success' && 'true' || 'false' }}
      run_id: ${{ steps.find.outputs.run_id }}
      artifact_id: ${{ steps.find.outputs.acceptance_artifact_id }}
      release_set_sha256: ${{ steps.verify.outputs.release_set_sha256 }}
      release_tooling_artifact_id: ${{ steps.find.outputs.tooling_artifact_id }}
      release_tooling_sha256: ${{ steps.verify.outputs.tooling_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Find a successful full run of main for this commit
        id: find
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release-reuse.mjs find "${{ needs.resolve.outputs.source_sha }}"
      - name: Download its tested release set
        id: acceptance
        if: ${{ steps.find.outputs.found == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.find.outputs.acceptance_artifact_id }}
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/reused-acceptance
          merge-multiple: true
      - name: Download its tested release host
        id: tooling
        if: ${{ steps.acceptance.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.find.outputs.tooling_artifact_id }}
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/reused-tooling
          merge-multiple: true
      - name: Re-derive the full profile, source and digests CI recorded
        id: verify
        if: ${{ steps.tooling.outcome == 'success' }}
        continue-on-error: true
        run: >-
          node tools/release-reuse.mjs verify "$RUNNER_TEMP/reused-acceptance"
          "$RUNNER_TEMP/reused-tooling" "${{ needs.resolve.outputs.source_sha }}"
      - name: Say which evidence this release uses
        if: ${{ always() }}
        env:
          REUSED: ${{ steps.verify.outcome == 'success' }}
          RUN_ID: ${{ steps.find.outputs.run_id }}
        run: |
          if [ "$REUSED" = true ]; then
            echo "Reusing verified full acceptance from run $RUN_ID." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No verified full acceptance to reuse; the full gate runs for this tag." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Verify exact release candidate
    needs: [resolve, reuse]
    # Whenever reuse did not end in verified evidence, including when that job itself failed.
    # Without a status function a failed `reuse` would skip this job and block the release.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.reuse.outputs.reused != 'true' }}
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
    permissions:
      contents: read

  publish:
    name: Publish or resume through native ts-release npm OIDC
    needs: [resolve, reuse, build]
    # Exactly one of reuse and build supplied the tested artifacts.
    if: >-
      ${{ !cancelled() && inputs.publish && vars.NPM_PUBLISH_ENABLED == 'true' &&
      needs.resolve.result == 'success' && (needs.reuse.outputs.reused == 'true' ||
      needs.build.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      # Durable prepared artifacts and the append-only ts-release journal.
      contents: write
      id-token: write
      # Downloading a reused run's artifacts.
      actions: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Release-host pin; the library's acceptance pins remain independent.
          node-version: '22.22.2'
          package-manager-cache: false
      - name: Download the immutable tested artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.reuse.outputs.reused == 'true' && needs.reuse.outputs.artifact_id || needs.build.outputs.artifact_id }}
          run-id: ${{ needs.reuse.outputs.reused == 'true' && needs.reuse.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/npm-release
          merge-multiple: true
      - name: Download the tested release host
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.reuse.outputs.reused == 'true' && needs.reuse.outputs.release_tooling_artifact_id || needs.build.outputs.release_tooling_artifact_id }}
          run-id: ${{ needs.reuse.outputs.reused == 'true' && needs.reuse.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-tooling
          merge-multiple: true
      - name: Verify and unpack the frozen host
        env:
          EXPECTED_TOOLING_DIGEST: ${{ needs.reuse.outputs.reused == 'true' && needs.reuse.outputs.release_tooling_sha256 || needs.build.outputs.release_tooling_sha256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release-tooling"
          printf '%s  release-tooling.tar.gz\n' "$EXPECTED_TOOLING_DIGEST" | sha256sum --check --strict
          tar -xzf release-tooling.tar.gz
      - name: Publish exact artifacts with durable recovery
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_DIGEST: ${{ needs.reuse.outputs.reused == 'true' && needs.reuse.outputs.release_set_sha256 || needs.build.outputs.release_set_sha256 }}
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/npm-release
          GITHUB_TOKEN: ${{ github.token }}
          NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          test "$(node --version)" = v22.22.2
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          # No installs, builds, npm subprocesses or package lifecycle scripts.
          # Installs used --ignore-scripts in the read-only build job.
          cd "$RUNNER_TEMP/release-tooling/tools/release"
          node --input-type=module <<'JS'
          import { writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          const cacheDirectory = join(process.env.RUNNER_TEMP, 'release-state');
          await writeFile('release-input.json', JSON.stringify({
            sourceSha: process.env.SOURCE_SHA,
            tag: process.env.RELEASE_TAG,
            expectedDigest: process.env.EXPECTED_DIGEST,
            artifacts: process.env.ARTIFACT_DIRECTORY,
            cacheDirectory,
            authorize: true,
          }));
          JS
          node node_modules/.bin/ts-release src/application.js release-input.json > "$ARTIFACT_DIRECTORY/publication-report.json"
      - name: Retain the derived publication report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browserbase-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-release/publication-report.json
          if-no-files-found: warn
          retention-days: 30
